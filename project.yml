name: HabitSwap
options:
  bundleIdPrefix: jp.tetris-solution
  deploymentTarget:
    iOS: "26.5"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Resources/HabitSwap.entitlements
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  HabitSwap:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tetris-solution.habitswap
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: HabitSwap
    dependencies:
      - target: ShieldConfigurationExtension
      - target: ShieldActionExtension
      - target: DeviceActivityMonitorExtension

  ShieldConfigurationExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfigurationExtension
      - Shared
    info:
      path: ShieldConfigurationExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tetris-solution.habitswap.shieldconfiguration

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShieldActionExtension
      - Shared
    info:
      path: ShieldActionExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tetris-solution.habitswap.shieldaction

  DeviceActivityMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - DeviceActivityMonitorExtension
      - Shared
    info:
      path: DeviceActivityMonitorExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.tetris-solution.habitswap.deviceactivitymonitor
